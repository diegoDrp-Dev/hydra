name: Koryn Security Platform CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://koryn:koryn@localhost:5432/koryn
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm exec --workspace=api-gateway prisma validate
      - run: npm exec --workspace=api-gateway prisma generate
      - run: npm run validate
